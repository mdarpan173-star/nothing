<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Be My Valentine? 🌸</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: linear-gradient(135deg, #ffeef2 0%, #ffd6e0 100%);
      font-family: 'Comic Sans MS', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }
    #flowerCanvas {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 1; pointer-events: none;
    }
    .card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      padding: 35px 25px;
      border-radius: 30px;
      box-shadow: 0 15px 35px rgba(230, 80, 120, 0.2);
      border: 4px solid #fff;
      max-width: 360px;
      width: 90%;
      text-align: center;
      z-index: 2;
      animation: float 4s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    .icon-box {
      font-size: 3.5rem; margin-bottom: 10px;
      animation: pulse 1.5s infinite alternate;
    }
    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.15); }
    }
    h1 { color: #ff4d6d; font-size: 1.7rem; margin-bottom: 10px; }
    p { color: #7209b7; font-size: 1rem; margin-bottom: 25px; font-weight: 600; }
    .btn-container { display: flex; justify-content: center; align-items: center; gap: 15px; min-height: 90px; }
    button {
      padding: 14px 24px; border: none; border-radius: 50px;
      font-size: 1.05rem; font-weight: bold; cursor: pointer;
      box-shadow: 0 6px 15px rgba(0,0,0,0.1);
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      touch-action: manipulation;
    }
    #yesBtn { background: linear-gradient(135deg, #ff758f 0%, #ff4d6d 100%); color: white; }
    #noBtn { background-color: #f8f9fa; color: #6c757d; border: 2px solid #e9ecef; }
  </style>
</head>
<body>

  <canvas id="flowerCanvas"></canvas>

  <div class="card" id="mainCard">
    <div class="icon-box" id="icon">💖</div>
    <h1 id="question">Will you be my Valentine?</h1>
    <p id="subtext">Flowers are blooming just for you! 🌸</p>
    
    <div class="btn-container">
      <button id="yesBtn" onclick="handleYes()">Yes! 💕</button>
      <button id="noBtn" onclick="handleNo()">No 🥺</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('flowerCanvas');
    const ctx = canvas.getContext('2d');
    
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    class Flower {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.maxStemHeight = Math.random() * 80 + 60;
        this.currentStemHeight = 0;
        this.stemSpeed = Math.random() * 1.5 + 1;
        this.petalSize = 0;
        this.maxPetalSize = Math.random() * 10 + 12;
        this.petalSpeed = 0.3;
        this.petalColor = ['#ffb3c1', '#ff8fa3', '#c77dff', '#e0aaff'][Math.floor(Math.random() * 4)];
        this.centerColor = '#ffb703';
        this.angle = Math.random() * Math.PI * 2;
      }

      update() {
        if (this.currentStemHeight < this.maxStemHeight) {
          this.currentStemHeight += this.stemSpeed;
        } else if (this.petalSize < this.maxPetalSize) {
          this.petalSize += this.petalSpeed;
        }
      }

      draw() {
        ctx.beginPath();
        ctx.moveTo(this.x, this.y);
        ctx.quadraticCurveTo(this.x + 5, this.y - this.currentStemHeight / 2, this.x, this.y - this.currentStemHeight);
        ctx.strokeStyle = '#81b29a';
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        ctx.stroke();

        if (this.currentStemHeight >= this.maxStemHeight / 2) {
          const flowerX = this.x;
          const flowerY = this.y - this.currentStemHeight;

          for (let i = 0; i < 5; i++) {
            const angle = this.angle + (i * Math.PI * 2) / 5;
            const px = flowerX + Math.cos(angle) * (this.petalSize / 1.5);
            const py = flowerY + Math.sin(angle) * (this.petalSize / 1.5);

            ctx.beginPath();
            ctx.arc(px, py, this.petalSize, 0, Math.PI * 2);
            ctx.fillStyle = this.petalColor;
            ctx.fill();
          }

          ctx.beginPath();
          ctx.arc(flowerX, flowerY, this.petalSize / 2, 0, Math.PI * 2);
          ctx.fillStyle = this.centerColor;
          ctx.fill();
        }
      }
    }

    const flowers = [];
    for (let i = 0; i < 25; i++) {
      flowers.push(new Flower(Math.random() * window.innerWidth, window.innerHeight + 10));
    }

    function animateFlowers() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      flowers.forEach(flower => {
        flower.update();
        flower.draw();
      });
      requestAnimationFrame(animateFlowers);
    }
    animateFlowers();

    const noPhrases = [
      "No 🥺", "Are you sure? 💔", "Think again! 🌸",
      "Pretty please? 🥺", "Don't do this! 😭",
      "Look at the flowers! 💐", "Give it another shot!", "Change of heart? ✨"
    ];
    let noIndex = 0;
    let yesScale = 1;

    function handleNo() {
      const yesBtn = document.getElementById('yesBtn');
      const noBtn = document.getElementById('noBtn');
      noIndex = (noIndex + 1) % noPhrases.length;
      noBtn.innerText = noPhrases[noIndex];
      yesScale += 0.3;
      yesBtn.style.transform = `scale(${yesScale})`;
    }

    function handleYes() {
      const card = document.getElementById('mainCard');
      confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
      card.innerHTML = `
        <div class="icon-box">💐🎉</div>
        <h1>YAY! You made my day!</h1>
        <p>I can't wait for Feb 14th! ❤️</p>
      `;
    }
  </script>
</body>
    </html>
